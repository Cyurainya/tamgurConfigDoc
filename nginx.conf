server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /doc/aidoc.html;
    }

    location = /doc {
        return 301 /doc/aidoc.html;
    }

    location = /doc/ {
        return 302 /doc/aidoc.html;
    }

    location /doc/ {
        try_files $uri $uri/ /doc/aidoc.html;
    }

    location /doc/assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
