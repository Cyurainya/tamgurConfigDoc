server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /toolTips;
    }

    location = /doc {
        return 301 /toolTips;
    }

    location = /doc/ {
        return 301 /toolTips;
    }

    location /doc/ {
        return 301 /toolTips;
    }

    location = /toolTips {
        try_files /toolTips/index.html =404;
    }

    location /toolTips/ {
        try_files $uri $uri/ /toolTips/index.html;
    }

    location /toolTips/assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
